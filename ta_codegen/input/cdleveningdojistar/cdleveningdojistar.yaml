name: CDLEVENINGDOJISTAR
group: Pattern Recognition
hint: Evening Doji Star
flags: [candlestick, stream]
inputs:
  - name: inPriceOHLC
    type: price
    price_components: [open, high, low, close]
optional_inputs:
